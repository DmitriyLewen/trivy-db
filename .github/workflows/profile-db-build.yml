---
name: Profile DB build
on:
  # Triggered by pushing to this throwaway branch: `workflow_dispatch` requires
  # the workflow to be present on the repository's default branch.
  push:
    branches:
      - ci/profile-db-build
  workflow_dispatch:
env:
  # Always fetch the upstream data: forks of vuln-list are stale and would not
  # reproduce the memory profile of the real build.
  REPO_OWNER: aquasecurity
permissions:
  contents: read

jobs:
  build:
    name: Profile DB build
    runs-on: ubuntu-24.04
    steps:
      # vuln-list dirs + language repositories use more than 31GB of storage
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-cached-tools: 'true'
          remove-swapfile: 'true'

      - name: Check out code into the Go module directory
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod

      - name: Download vuln-list and advisories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make db-fetch-langs db-fetch-vuln-list

      - name: Report input sizes
        run: du -sh cache/* | sort -h

      - name: Build the binary
        run: make build

      - name: Build database (profiled)
        env:
          # Max live heap observed across all sources is ~6.7GB, so this leaves
          # ~3.3GB of headroom for garbage between collections.
          GOMEMLIMIT: 10GiB
        run: |
          # Sample available memory and the builder's RSS every 5s in the background.
          # The samples are streamed to the log, so the curve survives even when the
          # process is killed by the OOM killer and later steps never run.
          (
            while true; do
              avail=$(awk '/^MemAvailable:/ {printf "%d", $2 / 1024}' /proc/meminfo)
              rss=$(ps -o rss= -C trivy-db 2>/dev/null | head -1 | tr -d ' ')
              echo "[mem] $(date -u +%H:%M:%S) avail=${avail}MB rss=$(( ${rss:-0} / 1024 ))MB"
              sleep 5
            done
          ) &
          sampler=$!
          trap 'kill "${sampler}" 2>/dev/null' EXIT

          # gctrace prints live heap and heap goal at every GC cycle.
          GODEBUG=gctrace=1 /usr/bin/time -v make db-build
